<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kylee's 18th</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
 <!-- LANDING SCENE -->
<section id="landing-scene">

    <div class="envelope-container">

        <img
            id="closed-envelope"
            src="images/envelope-closed.jpg"
            alt=""
        >

        <img
            id="open-envelope"
            src="images/envelope-open.jpg"
            alt=""
        >

        <img
            id="envelope-silhouette"
            src="images/envelope-silhouette.png"
            alt=""
        >

    </div>

    <div class="date-section">
        <p>Password? (P.S, it's your birthday)</p>

        <input type="date" id="birthday-date">

        <button id="start-button">Start</button>
    </div>

</section>


<!-- PHOTO SCENE -->
<section id="photo-scene">

    <div class="photo photo-1">
        <img src="images/photo1.jpg" alt="">
    </div>

    <div class="photo photo-2">
        <img src="images/photo2.jpg" alt="">
    </div>

    <div class="photo photo-3">
        <img src="images/photo3.jpg" alt="">
    </div>

    <div class="photo photo-4">
        <img src="images/photo4.jpg" alt="">
    </div>

    <div class="photo photo-5">
        <img src="images/photo5.jpg" alt="">
    </div>

</section>


<!-- FLASH -->
<div id="flash"></div>
    
</body>
</html>
